name: ECO Collect web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/eco-collect-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/rules.test.ts
      - run: npm run test:integration
      - run: npx tsc --noEmit
